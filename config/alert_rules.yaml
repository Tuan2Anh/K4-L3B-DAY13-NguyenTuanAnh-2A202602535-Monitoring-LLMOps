alerts:
  - name: HighLatencyP95
    severity: warning
    condition: 'p95(latency_ms) > 3000'
    duration: 5m
    type: symptom-based
    channel: '#k4-l3b-alerts'
    owner: student-2A202602535
    runbook: docs/alerts.md#alert-1
  - name: HighErrorRate
    severity: critical
    condition: 'error_rate_pct > 2.0'
    duration: 3m
    type: symptom-based
    channel: '#k4-l3b-critical'
    owner: student-2A202602535
    runbook: docs/alerts.md#alert-2
  - name: LowRetrievalSuccessRate
    severity: warning
    condition: 'retrieval_success_rate_pct < 90.0'
    duration: 5m
    type: symptom-based
    channel: '#k4-l3b-alerts'
    owner: student-2A202602535
    runbook: docs/alerts.md#alert-3
